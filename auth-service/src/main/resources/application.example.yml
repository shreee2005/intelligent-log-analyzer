server:
  port: 8091

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/loganalyzer
    username: admin
    password: your_secure_db_password
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: defaultSecretKeyThatIsAtLeast32BytesLongForHS256

oauth2:
  google:
    client-id: ""
    client-secret: ""
  github:
    client-id: ""
    client-secret: ""

app:
  frontend-url: http://localhost:3001
