server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: analysis-anomalies
              uri: ${ANALYSIS_URL:http://analysis-service:8083}
              predicates:
                - Path=/api/projects/*/anomalies/**
            - id: alert-webhooks
              uri: ${ALERT_SERVICE_URL:http://alert-service:8085}
              predicates:
                - Path=/api/projects/*/webhooks/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8091}
              predicates:
                - Path=/api/auth/**,/api/projects/**
            - id: ingestion-service
              uri: ${LOG_INGESTION_URL:http://log-ingestion-service:8086}
              predicates:
                - Path=/api/ingestion/**,/api/v1/logs/**
            - id: processor-service
              uri: ${STREAM_PROCESSOR_URL:http://stream-processor-service:8082}
              predicates:
                - Path=/api/processor/**
            - id: analysis-service
              uri: ${ANALYSIS_URL:http://analysis-service:8083}
              predicates:
                - Path=/api/analysis/**,/api/v1/analytics/**
            - id: search-service
              uri: ${SEARCH_URL:http://search-service:8084}
              predicates:
                - Path=/api/search/**,/api/v1/search/**
            - id: alert-service
              uri: ${ALERT_SERVICE_URL:http://alert-service:8085}
              predicates:
                - Path=/api/alert/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.loganalyzer: DEBUG
