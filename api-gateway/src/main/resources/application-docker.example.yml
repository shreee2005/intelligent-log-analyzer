server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ingestion-service
          uri: http://log-ingestion-service:8086
          predicates:
            - Path=/api/ingestion/**
        - id: processor-service
          uri: http://stream-processor-service:8082
          predicates:
            - Path=/api/processor/**
        - id: analysis-service
          uri: http://analysis-service:8083
          predicates:
            - Path=/api/analysis/**
        - id: search-service
          uri: http://search-service:8084
          predicates:
            - Path=/api/search/**
        - id: alert-service
          uri: http://alert-service:8085
          predicates:
            - Path=/api/alert/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.loganalyzer: DEBUG
